name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Installer les dépendances (lockfile strict)
        run: uv sync --locked

      - name: Lint
        run: make lint

      - name: Typage
        run: make typecheck

      - name: Tests
        run: make test
