# Stack locale du projet. Les services s'ajoutent phase par phase (mlflow, api, grafana…).
# Ports publiés sur 127.0.0.1 uniquement : rien n'est exposé sur le réseau.
# Ports d'hôte décalés (Postgres 5433, Prefect 4201) pour coexister avec la stack des TP (5432, 4200).
name: tennis-mlops

x-app: &app
  build: .
  image: tennis-mlops:local
  restart: unless-stopped
  env_file:
    - path: .env
      required: false

# Initialisation de PostgreSQL : une base et un compte par usage. Le script est écrit ici (et non dans un fichier
# monté) pour ne pas dépendre des droits des fichiers de la machine hôte. Mots de passe de démonstration, surchargés
# par .env.
configs:
  postgres-init:
    content: |
      CREATE ROLE tennis LOGIN PASSWORD '${TENNIS_DB_PASSWORD:-tennis-local}';
      CREATE DATABASE tennis OWNER tennis;
      CREATE ROLE prefect LOGIN PASSWORD '${PREFECT_DB_PASSWORD:-prefect-local}';
      CREATE DATABASE prefect OWNER prefect;

services:
  mock_source:
    <<: *app
    command: ["python", "-m", "mock_source"]
    ports:
      - "127.0.0.1:${MOCK_SOURCE_PORT:-8001}:8001"
    volumes:
      # Données téléchargées par `make data`, vérifiées contre configs/data.lock.json au démarrage.
      - ./data/raw:/app/data/raw:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1g

  postgres:
    image: postgres:18.6-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres-local}"
    configs:
      - source: postgres-init
        target: /docker-entrypoint-initdb.d/010-init.sql
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      # PostgreSQL 18 range ses données dans un sous-dossier de version sous /var/lib/postgresql.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d tennis"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512m

  prefect:
    image: prefecthq/prefect:3.8.7-python3.12
    restart: unless-stopped
    command: ["prefect", "server", "start", "--host", "0.0.0.0", "--port", "4200"]
    environment:
      PREFECT_HOME: /var/lib/prefect
      # Backend PostgreSQL : SQLite ne supporte pas les écritures concurrentes des flows et de l'UI.
      PREFECT_SERVER_DATABASE_CONNECTION_URL: "postgresql+asyncpg://prefect:${PREFECT_DB_PASSWORD:-prefect-local}@postgres:5432/prefect"
      PREFECT_SERVER_UI_API_URL: "http://127.0.0.1:${PREFECT_PORT:-4201}/api"
      PREFECT_API_URL: http://127.0.0.1:4200/api
      PREFECT_SERVER_ANALYTICS_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PREFECT_PORT:-4201}:4200"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4200/api/health', timeout=5)"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1g

volumes:
  postgres_data:
