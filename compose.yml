# Stack locale du projet. Les services s'ajoutent phase par phase (api, interface, grafana…).
# Ports publiés sur 127.0.0.1 uniquement : rien n'est exposé sur le réseau.
# Ports d'hôte décalés (Postgres 5433, Prefect 4201, MLflow 7282) pour coexister avec la stack des TP.
name: tennis-mlops

x-app: &app
  build:
    context: .
    args:
      GIT_COMMIT: "${GIT_COMMIT:-}"  # passé par le Makefile (git rev-parse HEAD)
  image: tennis-mlops:local
  restart: unless-stopped
  env_file:
    - path: .env
      required: false

# Adresses vues depuis les conteneurs (phase 6). Elles remplacent celles de .env, écrites pour la machine hôte
# (127.0.0.1:5433…). Les liens des cartes Teams, eux, sont ouverts par le navigateur : adresses publiées sur l'hôte.
x-internal: &internal
  TENNIS_POSTGRES_DSN: "postgresql://tennis:${TENNIS_DB_PASSWORD:-tennis-local}@postgres:5432/tennis"
  TENNIS_MLFLOW_TRACKING_URI: http://mlflow:7282
  TENNIS_PREFECT_API_URL: http://prefect:4200/api
  PREFECT_API_URL: http://prefect:4200/api
  TENNIS_MOCK_SOURCE_URL: http://mock_source:8001
  TENNIS_ALERT_SINK_URL: http://alert_sink:8090
  TENNIS_PREFECT_UI_URL: "http://127.0.0.1:${PREFECT_PORT:-4201}"
  TENNIS_MLFLOW_UI_URL: "http://127.0.0.1:${MLFLOW_PORT:-7282}"
  MLFLOW_DISABLE_AGENT_HINT: "1"

# Comptes et bases de PostgreSQL, un par usage. Script idempotent rejoué à chaque `make up` par le service
# `postgres-setup` : une base ajoutée dans une phase ultérieure est créée même sur un volume existant (le dossier
# docker-entrypoint-initdb.d, lui, n'est lu qu'à la toute première initialisation). Écrit ici, et non dans un
# fichier monté, pour ne pas dépendre des droits des fichiers de la machine hôte. Mots de passe de démonstration,
# surchargés par .env.
configs:
  postgres-setup:
    content: |
      SELECT 'CREATE ROLE tennis LOGIN PASSWORD ''${TENNIS_DB_PASSWORD:-tennis-local}''' WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'tennis')\gexec
      SELECT 'CREATE DATABASE tennis OWNER tennis' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'tennis')\gexec
      SELECT 'CREATE ROLE prefect LOGIN PASSWORD ''${PREFECT_DB_PASSWORD:-prefect-local}''' WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'prefect')\gexec
      SELECT 'CREATE DATABASE prefect OWNER prefect' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'prefect')\gexec
      SELECT 'CREATE ROLE mlflow LOGIN PASSWORD ''${MLFLOW_DB_PASSWORD:-mlflow-local}''' WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'mlflow')\gexec
      SELECT 'CREATE DATABASE mlflow OWNER mlflow' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'mlflow')\gexec

services:
  mock_source:
    <<: *app
    command: ["python", "-m", "mock_source"]
    ports:
      - "127.0.0.1:${MOCK_SOURCE_PORT:-8001}:8001"
    volumes:
      # Données téléchargées par `make data`, vérifiées contre configs/data.lock.json au démarrage.
      - ./data/raw:/app/data/raw:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1g

  postgres:
    image: postgres:18.6-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres-local}"
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      # PostgreSQL 18 range ses données dans un sous-dossier de version sous /var/lib/postgresql.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512m

  postgres-setup:
    # Tâche ponctuelle : crée les comptes et bases manquants puis s'arrête (code 0). Les services qui en dépendent
    # attendent sa fin (`service_completed_successfully`).
    image: postgres:18.6-bookworm
    restart: "no"
    command: ["psql", "-v", "ON_ERROR_STOP=1", "-h", "postgres", "-U", "postgres", "-d", "postgres", "-f", "/setup.sql"]
    environment:
      PGPASSWORD: "${POSTGRES_PASSWORD:-postgres-local}"
    configs:
      - source: postgres-setup
        target: /setup.sql
    depends_on:
      postgres:
        condition: service_healthy

  prefect:
    image: prefecthq/prefect:3.8.7-python3.12
    restart: unless-stopped
    command: ["prefect", "server", "start", "--host", "0.0.0.0", "--port", "4200"]
    environment:
      PREFECT_HOME: /var/lib/prefect
      # Backend PostgreSQL : SQLite ne supporte pas les écritures concurrentes des flows et de l'UI.
      PREFECT_SERVER_DATABASE_CONNECTION_URL: "postgresql+asyncpg://prefect:${PREFECT_DB_PASSWORD:-prefect-local}@postgres:5432/prefect"
      PREFECT_SERVER_UI_API_URL: "http://127.0.0.1:${PREFECT_PORT:-4201}/api"
      PREFECT_API_URL: http://127.0.0.1:4200/api
      PREFECT_SERVER_ANALYTICS_ENABLED: "false"
    depends_on:
      postgres-setup:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${PREFECT_PORT:-4201}:4200"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4200/api/health', timeout=5)"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1g

  mlflow:
    <<: *app
    # Même image que le reste du projet : MLflow 3.16.1 et le pilote psycopg viennent de uv.lock.
    command:
      - mlflow
      - server
      - --host=0.0.0.0
      - --port=7282
      - --workers=2
      - --backend-store-uri=postgresql+psycopg://mlflow:${MLFLOW_DB_PASSWORD:-mlflow-local}@postgres:5432/mlflow
      # Artefacts servis par le serveur (mlflow-artifacts:/) : les clients n'écrivent jamais sur un chemin local.
      - --serve-artifacts
      - --artifacts-destination=/var/lib/mlflow/artifacts
      # Protection contre le DNS rebinding : seuls ces en-têtes Host sont acceptés (navigateur et autres conteneurs).
      - --allowed-hosts=localhost:*,127.0.0.1:*,mlflow:*
    volumes:
      - mlflow_artifacts:/var/lib/mlflow
    depends_on:
      postgres-setup:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${MLFLOW_PORT:-7282}:7282"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7282/health', timeout=5)"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1g

  # --------------------------------------------------------------------------- phase 6 : orchestration et alertes

  orchestration-setup:
    # Tâche ponctuelle, rejouée à chaque `make up` : work pool, déploiements et automations dans Prefect (idempotent,
    # la simulation garde son état de pause). Voir src/tennis_mlops/orchestration/setup.py.
    <<: *app
    restart: "no"
    command: ["python", "-m", "tennis_mlops.orchestration", "setup"]
    environment:
      <<: *internal
    depends_on:
      prefect:
        condition: service_healthy

  alert_sink:
    # Reçoit les automations Prefect (échec, dégradé) et les décisions du registre, construit la carte, l'envoie sur
    # Teams si TENNIS_TEAMS_WEBHOOK_URL est défini dans .env, et garde l'historique (make alerts).
    <<: *app
    command: ["python", "-m", "tennis_mlops.alerts", "serve", "--host", "0.0.0.0", "--port", "8090"]
    environment:
      <<: *internal
      TENNIS_ALERT_HOST: "${TENNIS_ALERT_HOST:-}"  # nom du Mac, passé par le Makefile (sinon : id du conteneur)
    ports:
      - "127.0.0.1:${ALERT_SINK_PORT:-8090}:8090"
    depends_on:
      postgres-setup:
        condition: service_completed_successfully
      prefect:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512m

  worker:
    # Exécute les runs des déploiements (simulation, ingestion, entraînement) dans ce conteneur : chaque run est un
    # sous-processus, avec les adresses internes ci-dessus. L'état (quarantaine, Great Expectations) est partagé
    # avec la machine hôte : `make lots`, `make gx-docs` voient ce que le worker a produit.
    <<: *app
    command: ["prefect", "worker", "start", "--pool", "tennis-pool", "--type", "process", "--name", "tennis-worker",
              "--limit", "3", "--with-healthcheck"]
    environment:
      <<: *internal
    volumes:
      - ./state:/app/state
    depends_on:
      orchestration-setup:
        condition: service_completed_successfully
      alert_sink:
        condition: service_healthy
      mock_source:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 3g

volumes:
  postgres_data:
  mlflow_artifacts:
