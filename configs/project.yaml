# Configuration de l'expérience (versionnée, tracée dans MLflow).
# Les URLs et secrets ne vont PAS ici : voir .env.example.

data:
  raw_dir: data/raw                   # ignoré par Git (licence CC BY-NC-SA : pas de redistribution)
  lock_file: configs/data.lock.json   # révisions résolues + SHA-256 de chaque fichier (versionné)
  first_match_year: 2010
  last_match_year: 2026               # 2026 est partiel côté source (jusqu'à fin mai)
  # Ordre = priorité. La 2e source n'est utilisée que si la 1re est injoignable ;
  # une différence de contenu, elle, est toujours bloquante (SHA-256 du lock).
  sources:
    - kind: huggingface
      repo: Aneeshers/tennis-sackmann-archive
      revision: main
      subdir: atp
    - kind: github
      repo: Aneeshers/tennis-sackmann-archive
      revision: main
      subdir: atp

simulation:
  bootstrap_start: 2010-01-01   # historique disponible dès le départ
  replay_start: 2015-01-01      # début du rejeu : le temps simulé avance à partir d'ici
  replay_end: 2026-05-31        # dernier tournoi disponible dans la source

mock_source:
  first_round_notice_days: 2    # le tableau (1er tour) est connu 2 jours avant le début du tournoi
  tournament_notice_days: 14    # un tournoi apparaît dans le calendrier 14 jours avant
  fixture_horizon_days: 7       # horizon par défaut de GET /fixtures
  pauses:
    - start: 2020-03-09
      end: 2020-08-21
      reason: "Circuit ATP suspendu (COVID-19) entre Acapulco/Dubaï et la reprise à New York"

ingestion:
  http_timeout_s: 10            # au-delà, l'appel compte comme un échec (chaos `slow`)
  retries: 3                    # nouveaux essais sur panne (503, timeout, connexion) ; jamais sur 4xx
  retry_delays_s: [1, 2, 4]     # backoff exponentiel entre les essais
  state_dir: state              # zone brute, quarantaine, rapports Great Expectations (hors Git)
  drift_min_history: 20         # tournois de même niveau nécessaires pour surveiller la dérive
  drift_quantiles: [0.005, 0.995]

demo:
  sleep_s: 0.0                  # > 0 pour ralentir les tasks et les rendre visibles dans l'UI Prefect
