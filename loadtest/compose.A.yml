# Configuration A (phase 10) : 1 réplica, 0,5 CPU, 512 Mo, 1 worker uvicorn.
# docker compose -f compose.yml -f loadtest/compose.A.yml up -d --wait api   (fait par run_campaign.py)
services:
  api:
    command: ["python", "-m", "tennis_mlops.api", "serve", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m
