# Configuration C (phase 10) : 2 réplicas de B derrière nginx (2 CPU en tout).
# L'équilibreur prend le port publié de l'API ; les autres services (scoring, interface) joignent toujours
# http://api:8000, que Docker répartit entre les réplicas.
services:
  api:
    command: ["python", "-m", "tennis_mlops.api", "serve", "--host", "0.0.0.0", "--port", "8000", "--workers", "2"]
    ports: !reset []
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "1"
          memory: 1536m

  api-lb:
    image: nginx:1.30.6-alpine
    restart: unless-stopped
    volumes:
      - ./loadtest/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128m
