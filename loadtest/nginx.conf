# Équilibreur de la configuration C (phase 10) : répartit les requêtes entre les réplicas de l'API.
worker_processes auto;
events { worker_connections 4096; }

http {
    access_log off;
    # Au démarrage, le DNS de Docker renvoie l'adresse de chaque réplica de `api` : nginx les alterne
    # (round-robin). Il démarre après eux (depends_on healthy) ; si un réplica est recréé, relancer api-lb.
    upstream api {
        server api:8000;
        keepalive 64;
    }

    server {
        listen 8080;
        location / {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 2s;
            proxy_read_timeout 30s;
            proxy_next_upstream error timeout http_502 http_503;
        }
    }
}
