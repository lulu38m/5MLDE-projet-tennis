[project]
name = "tennis-mlops"
version = "0.1.0"
description = "Projet final 5MLDE — chaîne MLOps de prédiction du vainqueur d'un match ATP"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx==0.28.1",
    "httpx2==2.16.0",
    "huggingface-hub==2.4.0",
    "numpy==2.2.6",
    "pandas==2.2.3",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.2",
    "pyyaml==6.0.3",
]

[dependency-groups]
dev = [
    "mypy==2.4.1",
    "pandas-stubs==2.2.3.250527",
    "pre-commit==4.7.0",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.3",
    "types-pyyaml==6.0.12.20261103",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

# --------------------------------------------------------------------------- ruff
[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # tri des imports
    "B",        # bugbear : bugs probables
    "UP",       # syntaxe Python moderne
    "N",        # nommage PEP 8
    "SIM",      # simplifications
    "PTH",      # pathlib plutôt que os.path
    "RUF",      # règles propres à ruff
    "ANN",      # annotations de type obligatoires
    "D",        # docstrings
]
ignore = [
    "D100", "D104", "D105", "D107",  # pas de docstring imposée pour modules, packages, méthodes magiques, __init__
    "D203", "D213",                  # conflits de style docstring : on garde D211 + D212
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN"]

[tool.ruff.lint.pydocstyle]
convention = "google"

# --------------------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# --------------------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: nécessite la stack docker compose (exclu par défaut en CI)",
]

[tool.coverage.run]
source = ["tennis_mlops"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
